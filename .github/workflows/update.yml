name: update

on:
  schedule:
    - cron: "0 21 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove preinstalled drivers
        shell: bash
        run: |
          for driver in chromedriver geckodriver msedgedriver; do
            path="$(command -v "$driver" || true)"
            if [ -n "$path" ]; then sudo rm -f "$path" 2>/dev/null || rm -f "$path"; fi
          done

      - name: Enable safaridriver
        if: runner.os == 'macOS'
        run: sudo safaridriver --enable

      - name: Collect (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a pnpm run collect

      - name: Collect (Windows/macOS)
        if: runner.os != 'Linux'
        run: pnpm run collect

      - name: Upload fragment
        uses: actions/upload-artifact@v4
        with:
          name: fragment-${{ matrix.name }}
          path: header.json

  merge:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download fragments
        uses: actions/download-artifact@v4
        with:
          path: fragments

      - name: Merge
        run: pnpm run merge

      - name: Commit
        continue-on-error: true
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Action"
          git add output.json header.json
          git commit -m "Update"
          git push origin main
